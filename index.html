<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCV 画像認識デバッグ & パラメータ調整ツール</title>

  <!-- OpenCV.js 読み込み（リポジトリ内の opencv.js / opencv.wasm を直接使用） -->
  <script>
    var cvReady = false;

    function checkCvReady() {
      if (typeof cv !== 'undefined' && cv.Mat) {
        if (!cvReady) {
          cvReady = true;
          const statusEl = document.getElementById("cvStatus");
          if (statusEl) {
            statusEl.innerText = "🟢 OpenCV準備完了";
            statusEl.style.background = "#d4edda";
            statusEl.style.color = "#155724";
          }
          console.log("OpenCV ready!");
        }
        return true;
      }
      return false;
    }

    var Module = {
      onRuntimeInitialized: function() {
        checkCvReady();
      }
    };

    // 0.3秒おきに初期化完了を検出するフォールバック処理
    const timer = setInterval(function() {
      if (checkCvReady()) {
        clearInterval(timer);
      }
    }, 300);
  </script>
  <!-- 外部CDNではなく、リポジトリ直下の opencv.js を直接読み込む -->
  <script async src="./opencv.js"></script>

  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; text-align: center; }
    h1 { font-size: 20px; margin-bottom: 5px; }
    .status { display: inline-block; padding: 6px 12px; border-radius: 4px; font-weight: bold; background: #fff3cd; color: #856404; margin-bottom: 15px; }
    
    .control-panel { background: #2d2d2d; padding: 15px; border-radius: 8px; max-width: 900px; margin: 0 auto 20px; text-align: left; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
    .control-group label { display: block; font-size: 13px; margin-bottom: 5px; color: #aaa; }
    .control-group input[type="range"] { width: 100%; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; max-width: 1200px; margin: 0 auto; }
    .card { background: #2d2d2d; border-radius: 8px; padding: 10px; }
    .card h3 { font-size: 14px; margin: 0 0 10px 0; color: #007bff; border-bottom: 1px solid #444; padding-bottom: 5px; }

    video, canvas { width: 100%; max-width: 320px; height: auto; border-radius: 4px; background: #000; display: block; margin: 0 auto; }
    .preview-split { display: flex; gap: 5px; justify-content: center; margin-top: 10px; }
    .preview-split canvas { width: 60px; height: 60px; object-fit: contain; border: 1px solid #555; }
    button { padding: 10px 20px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; margin: 10px; }
  </style>
</head>
<body>

  <h1>🛠️ OpenCV 連結ブロック認識デバッグツール</h1>
  <div id="cvStatus" class="status">OpenCV読み込み中...</div><br>

  <button onclick="startCamera()">1. カメラ起動</button>
  <button onclick="toggleAutoLoop()" id="loopBtn" style="background:#28a745;">2. リアルタイム解析 ON/OFF</button>

  <!-- パラメータ調整スライダー -->
  <div class="control-panel">
    <div class="control-group">
      <label>二値化 感度 (Block Size): <span id="valBlockSize">15</span></label>
      <input type="range" id="paramBlockSize" min="3" max="51" step="2" value="15" oninput="updateParams()">
    </div>
    <div class="control-group">
      <label>二値化 ノイズ許容 (Constant C): <span id="valC">3</span></label>
      <input type="range" id="paramC" min="1" max="20" step="1" value="3" oninput="updateParams()">
    </div>
    <div class="control-group">
      <label>最小輪郭面積 %: <span id="valMinArea">3</span>%</label>
      <input type="range" id="paramMinArea" min="1" max="30" step="1" value="3" oninput="updateParams()">
    </div>
  </div>

  <!-- 各工程の処理画像を表示する4分割グリッド -->
  <div class="grid-container">
    <div class="card">
      <h3>① カメラ生の映像</h3>
      <video id="webcam" autoplay playsinline muted></video>
    </div>

    <div class="card">
      <h3>② 二値化（OpenCVが見ている世界）</h3>
      <canvas id="canvasThresh"></canvas>
    </div>

    <div class="card">
      <h3>③ 輪郭検出 & 4角抽出 (赤枠/青点)</h3>
      <canvas id="canvasContours"></canvas>
    </div>

    <div class="card">
      <h3>④ 台形補正後 & 4分割確認</h3>
      <canvas id="canvasWarped"></canvas>
      <div id="splitPreviews" class="preview-split"></div>
    </div>
  </div>

  <script>
    let webcamEl = document.getElementById("webcam");
    let isLooping = false;

    function updateParams() {
      document.getElementById("valBlockSize").innerText = document.getElementById("paramBlockSize").value;
      document.getElementById("valC").innerText = document.getElementById("paramC").value;
      document.getElementById("valMinArea").innerText = document.getElementById("paramMinArea").value;
      if (!isLooping) processFrame();
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        webcamEl.srcObject = stream;
        webcamEl.onloadedmetadata = () => {
          console.log("Camera started");
          if (!isLooping) toggleAutoLoop();
        };
      } catch (e) {
        alert("カメラの起動に失敗しました: " + e.message);
      }
    }

    function toggleAutoLoop() {
      isLooping = !isLooping;
      document.getElementById("loopBtn").style.background = isLooping ? "#dc3545" : "#28a745";
      document.getElementById("loopBtn").innerText = isLooping ? "解析停止" : "リアルタイム解析開始";
      if (isLooping) loop();
    }

    function loop() {
      if (!isLooping) return;
      processFrame();
      requestAnimationFrame(loop);
    }

    // --- OpenCV パイプライン処理 ---
    function processFrame() {
      if (!cvReady || !webcamEl.videoWidth) return;

      const vw = webcamEl.videoWidth;
      const vh = webcamEl.videoHeight;

      let srcCanvas = document.createElement("canvas");
      srcCanvas.width = vw;
      srcCanvas.height = vh;
      let ctx = srcCanvas.getContext("2d");
      ctx.drawImage(webcamEl, 0, 0, vw, vh);

      let src = cv.imread(srcCanvas);
      let gray = new cv.Mat();
      let blur = new cv.Mat();
      let thresh = new cv.Mat();
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();

      let blockSize = parseInt(document.getElementById("paramBlockSize").value);
      let cVal = parseInt(document.getElementById("paramC").value);
      let minAreaPct = parseInt(document.getElementById("paramMinArea").value) / 100.0;

      // グレースケール ➔ ブラー ➔ 二値化
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
      cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);
      cv.adaptiveThreshold(blur, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, blockSize, cVal);

      cv.imshow(document.getElementById("canvasThresh"), thresh);

      // 輪郭検出
      cv.findContours(thresh, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      let maxArea = 0;
      let maxContour = null;
      let minAreaPx = (vw * vh) * minAreaPct;

      for (let i = 0; i < contours.size(); ++i) {
        let cnt = contours.get(i);
        let area = cv.contourArea(cnt);
        if (area > maxArea && area > minAreaPx) {
          maxArea = area;
          maxContour = cnt;
        }
      }

      let contoursDst = src.clone();
      const warpedCanvas = document.getElementById("canvasWarped");
      const targetW = 200, targetH = 600;
      warpedCanvas.width = targetW;
      warpedCanvas.height = targetH;

      if (maxContour) {
        let rotatedRect = cv.minAreaRect(maxContour);
        let vertices = cv.RotatedRect.points(rotatedRect);

        let ptsVector = new cv.MatVector();
        ptsVector.push_back(maxContour);
        cv.drawContours(contoursDst, ptsVector, -1, new cv.Scalar(255, 0, 0, 255), 3);
        ptsVector.delete();

        for (let i = 0; i < 4; i++) {
          cv.circle(contoursDst, vertices[i], 8, new cv.Scalar(0, 0, 255, 255), -1);
        }

        vertices.sort((a, b) => a.y - b.y);
        let topTwo = vertices.slice(0, 2).sort((a, b) => a.x - b.x);
        let bottomTwo = vertices.slice(2, 4).sort((a, b) => a.x - b.x);

        let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          topTwo[0].x, topTwo[0].y,
          topTwo[1].x, topTwo[1].y,
          bottomTwo[1].x, bottomTwo[1].y,
          bottomTwo[0].x, bottomTwo[0].y
        ]);

        let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
          0, 0, targetW, 0, targetW, targetH, 0, targetH
        ]);

        let M = cv.getPerspectiveTransform(srcTri, dstTri);
        let warpedMat = new cv.Mat();
        cv.warpPerspective(src, warpedMat, M, new cv.Size(targetW, targetH));
        cv.imshow(warpedCanvas, warpedMat);

        let previewDiv = document.getElementById("splitPreviews");
        previewDiv.innerHTML = "";
        let blockH = targetH / 4;

        for (let b = 0; b < 4; b++) {
          let c = document.createElement("canvas");
          c.width = targetW;
          c.height = blockH;
          let cCtx = c.getContext("2d");
          cCtx.drawImage(warpedCanvas, 0, b * blockH, targetW, blockH, 0, 0, targetW, blockH);
          previewDiv.appendChild(c);
        }

        M.delete(); srcTri.delete(); dstTri.delete(); warpedMat.delete();
      } else {
        let wCtx = warpedCanvas.getContext("2d");
        wCtx.fillStyle = "#333";
        wCtx.fillRect(0, 0, targetW, targetH);
        wCtx.fillStyle = "#ff4d4d";
        wCtx.font = "14px sans-serif";
        wCtx.fillText("ブロック枠が検出できません", 10, 50);
      }

      cv.imshow(document.getElementById("canvasContours"), contoursDst);

      src.delete(); gray.delete(); blur.delete(); thresh.delete();
      contours.delete(); hierarchy.delete(); contoursDst.delete();
    }
  </script>
</body>
</html>
